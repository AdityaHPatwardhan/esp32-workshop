# ESP Launchpad "Quick Start" config: one page with a dropdown of the workshop apps.
# Open:  https://espressif.github.io/esp-launchpad/?flashConfigURL=<URL of this file>
# Format: https://github.com/espressif/esp-launchpad/blob/main/config/config.toml
#
# Replace YOUR-GITHUB-USER below (and in the minimal-*.toml files) after publishing to GitHub Pages.

esp_toml_version = 1.0

# Directory holding the merged binaries (must end with "/").
firmware_images_url = "https://YOUR-GITHUB-USER.github.io/esp32-workshop/binaries/"

supported_apps = ["01-Blink", "03-Person-Detector"]

[01-Blink]
chipsets = ["ESP32-S3"]
image.esp32-s3 = "01_blink-merged.bin"
description = "Hello Board: prints a report about your board (chip, memory, camera, mic, Wi-Fi), then blinks the LED."
console_baudrate = 115200


[03-Person-Detector]
chipsets = ["ESP32-S3"]
image.esp32-s3 = "03_person_detector-merged.bin"
description = "TinyML person detection. Set your team name in the console, then watch the projector."
console_baudrate = 115200
